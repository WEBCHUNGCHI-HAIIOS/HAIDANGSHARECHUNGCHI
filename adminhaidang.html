<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ADMIN</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
height:100vh;
overflow:hidden;
display:flex;
}

/* màn hình giới thiệu */

#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10000;
text-align:center;
}

#intro button{
margin-top:20px;
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
background:#1877f2;
color:white;
cursor:pointer;
}

/* khu vực web bên trái */

.left{
flex:1;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:40px;
font-weight:bold;
text-align:center;
}

/* chatbot nửa màn hình */

#ai-bot-kit-chatbot{
position:fixed;
right:0;
top:0;
width:50vw;
height:100vh;
z-index:9999;
}

/* ẩn nút */

.ai-botkit-button{
display:none !important;
}

/* tuyết */

.snow{
position:fixed;
top:-10px;
color:white;
font-size:10px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(100vh);
}
}

/* NÚT FB TO HƠN */

.fb-btn{
position:fixed;
left:20px;
bottom:20px;
background:#1877f2;
color:white;
padding:16px 28px;
border-radius:30px;
font-weight:bold;
font-size:18px;
text-decoration:none;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
z-index:9999;
}

/* NÚT BOT TO */

.bot-btn{
position:fixed;
right:20px;
bottom:20px;
width:70px;
height:70px;
background:#25d366;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
color:white;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
z-index:9999;
cursor:pointer;
}

</style>
</head>

<body>

<!-- NHẠC -->
<audio id="nhac" loop>
<source src="nhac.mp3" type="audio/mpeg">
</audio>

<!-- MÀN HÌNH GIỚI THIỆU -->
<div id="intro">
<h1>Chào mừng đến với TRANG CHU ADMIN HAIDANG</h1>
<p>Web được tạo bởi ADMINHAIDANG</p>
<button onclick="vaoWeb()">Vào Trang Chủ</button>
</div>

<div class="left">
THONG TIN ADMIN HAIDANG
ĐƯỢC ADMINVIET CHỨNG MINMH
ĐỘ UY TÍN VÀ MINH BẠCH
QUỸ BẢO HIỂM 15.000.000
NHẬN GDTG-GT-DT-THU SELL All
DONE 1S
</div>

<!-- BOT -->
<div id="ai-bot-kit-chatbot" data-chatbot-id="ba1c1769-2922-44"></div>

<!-- NÚT FACEBOOK -->
<a href="https://www.facebook.com/ADMINGDTGDINHHOANG" target="_blank" class="fb-btn">
FB: ADMIN
</a>

<!-- NÚT BOT -->
<div class="bot-btn" onclick="openBot()">💬</div>

<script src="https://app.aibotkit.io/embed.js"></script>

<script>

/* vào web + phát nhạc */

function vaoWeb(){
document.getElementById("intro").style.display="none"
document.getElementById("nhac").play()
}

/* mở bot */

function openBot(){

let btn=document.querySelector(".ai-botkit-button")

if(btn){
btn.click()
}else{
setTimeout(openBot,300)
}

}

/* tuyết */

function snow(){

let snow=document.createElement("div")

snow.className="snow"
snow.innerHTML="❄"
snow.style.left=Math.random()*window.innerWidth+"px"
snow.style.animationDuration=(Math.random()*3+2)+"s"

document.body.appendChild(snow)

setTimeout(()=>{
snow.remove()
},5000)

}

setInterval(snow,120)

</script>

</body>
</html>
