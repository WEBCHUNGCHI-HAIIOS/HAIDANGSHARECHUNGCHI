<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

/* BOT NỬA MÀN HÌNH */

#chatbot{
position:fixed;
right:0;
top:0;
width:50%;
height:100%;
background:#111827;
display:flex;
flex-direction:column;
border-left:2px solid #1f2937;
}

/* HEADER */

#chat-header{
padding:15px;
background:#1f2937;
font-size:18px;
font-weight:bold;
}

/* MESSAGES */

#messages{
flex:1;
overflow-y:auto;
padding:15px;
}

/* MESSAGE */

.message{
margin-bottom:10px;
padding:10px;
border-radius:10px;
max-width:80%;
}

.user{
background:#2563eb;
margin-left:auto;
}

.bot{
background:#374151;
}

/* INPUT */

#input-area{
display:flex;
border-top:1px solid #1f2937;
}

#input{
flex:1;
padding:12px;
border:none;
outline:none;
background:#111827;
color:white;
}

#send{
padding:12px 20px;
background:#2563eb;
border:none;
color:white;
cursor:pointer;
}

#send:hover{
background:#1d4ed8;
}

/* RESPONSIVE */

@media(max-width:900px){
#chatbot{
width:100%;
}
}

</style>
</head>

<body>

<div id="chatbot">

<div id="chat-header">
🤖 AI CHAT
</div>

<div id="messages"></div>

<div id="input-area">
<input id="input" placeholder="Nhập tin nhắn...">
<button id="send">Gửi</button>
</div>

</div>

<script>

const messages = document.getElementById("messages")
const input = document.getElementById("input")
const send = document.getElementById("send")

function addMessage(text, type){

const div = document.createElement("div")
div.className = "message " + type
div.innerText = text

messages.appendChild(div)

messages.scrollTop = messages.scrollHeight

}

send.onclick = sendMessage

input.addEventListener("keypress", function(e){
if(e.key==="Enter") sendMessage()
})

async function sendMessage(){

const text = input.value.trim()

if(!text) return

addMessage(text,"user")

input.value=""

addMessage("Đang trả lời...","bot")

const response = await fetch("https://api.openai.com/v1/chat/completions",{

method:"POST",

headers:{
"Content-Type":"application/json",
"Authorization":"Bearer YOUR_API_KEY"
},

body:JSON.stringify({
model:"gpt-4o-mini",
messages:[
{role:"user",content:text}
]
})

})

const data = await response.json()

messages.lastChild.innerText =
data.choices[0].message.content

}

</script>

</body>
</html>
