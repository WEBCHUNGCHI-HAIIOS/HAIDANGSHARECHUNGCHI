<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Bạn Đồng Hành</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
height:100vh;
overflow:hidden;
display:flex;
}

/* khu vực web bên trái */

.left{
flex:1;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:40px;
font-weight:bold;
}

/* chatbot nửa màn hình */

#ai-bot-kit-chatbot{
position:fixed;
right:0;
top:0;
width:50vw;
height:100vh;
z-index:9999;
}

/* ẩn nút */

.ai-botkit-button{
display:none !important;
}

/* tuyết */

.snow{
position:fixed;
top:-10px;
color:white;
font-size:10px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(100vh);
}
}

</style>
</head>

<body>

<div class="left">
AI WEBSITE
</div>

<!-- BOT -->
<div id="ai-bot-kit-chatbot" data-chatbot-id="ba1c1769-2922-44"></div>

<script src="https://app.aibotkit.io/embed.js"></script>

<script>

/* tự mở bot */

function openBot(){

let btn=document.querySelector(".ai-botkit-button")

if(btn){
btn.click()
}else{
setTimeout(openBot,300)
}

}

openBot()

/* tuyết */

function snow(){

let snow=document.createElement("div")

snow.className="snow"
snow.innerHTML="❄"
snow.style.left=Math.random()*window.innerWidth+"px"
snow.style.animationDuration=(Math.random()*3+2)+"s"

document.body.appendChild(snow)

setTimeout(()=>{
snow.remove()
},5000)

}

setInterval(snow,120)

</script>

</body>
</html>
