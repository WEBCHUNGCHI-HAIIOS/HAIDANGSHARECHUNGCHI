<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI WEBSITE</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

/* chữ giữa */
.title{
font-size:40px;
font-weight:bold;
background:#2a6df4;
padding:10px 20px;
border-radius:5px;
}

/* nút chat */
.chat-btn{
position:fixed;
right:20px;
bottom:20px;
background:#25d366;
color:white;
width:55px;
height:55px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:26px;
text-decoration:none;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

/* nút facebook */
.fb-admin{
position:fixed;
left:20px;
bottom:20px;
background:#1877f2;
color:white;
padding:12px 18px;
border-radius:25px;
font-weight:bold;
text-decoration:none;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
transition:0.3s;
}

.fb-admin:hover{
background:#0f5ed7;
transform:scale(1.05);
}

/* hiệu ứng hạt */
.particle{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
opacity:0.7;
animation:move 10s linear infinite;
}

@keyframes move{
0%{transform:translateY(0);opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-100vh);opacity:0;}
}
</style>

</head>

<body>

<div class="title">AI WEBSITE</div>

<!-- nút facebook -->
<a href="https://www.facebook.com/ADMINGDTGDINHHOANG" target="_blank" class="fb-admin">
FB: ADMIN
</a>

<!-- nút chat -->
<a href="#" class="chat-btn">💬</a>

<script>
for(let i=0;i<60;i++){
let p=document.createElement("div");
p.className="particle";
p.style.left=Math.random()*100+"%";
p.style.top=Math.random()*100+"%";
p.style.animationDuration=(5+Math.random()*10)+"s";
document.body.appendChild(p);
}
</script>

</body>
</html>
