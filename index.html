<!DOCTYPE html>
<html>
<head>
    <title>My First 3D Game</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Tạo "Sân khấu" (Scene)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        // 2. Tạo "Máy quay" (Camera)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // 3. Tạo "Máy chiếu" (Renderer) để vẽ lên màn hình
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. Tạo "Vật thể" (Cái hộp 3D)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 }); // Màu xanh lá
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // 5. Thêm Ánh sáng (Để thấy được khối 3D)
        const light = new THREE.PointLight(0xffffff, 50);
        light.position.set(2, 2, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // 6. Vòng lặp để Game chạy (Animation)
        function animate() {
            requestAnimationFrame(animate);

            // Xoay cái hộp
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        animate();

        // Xử lý khi co giãn màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
