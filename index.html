<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game Bắn Súng</title>

<style>
body{
    margin:0;
    background:black;
    overflow:hidden;
}

#player{
    width:40px;
    height:40px;
    background:cyan;
    position:absolute;
    left:50%;
    top:50%;
}

.bullet{
    width:6px;
    height:12px;
    background:yellow;
    position:absolute;
}

.enemy{
    width:30px;
    height:30px;
    background:red;
    position:absolute;
}

#score{
    color:white;
    position:absolute;
    top:10px;
    left:10px;
}
</style>
</head>

<body>

<div id="player"></div>
<div id="score">0</div>

<script>
let player = document.getElementById("player");
let scoreText = document.getElementById("score");

let x = window.innerWidth/2;
let y = window.innerHeight/2;
let score = 0;

function update(){
    player.style.left = x + "px";
    player.style.top = y + "px";
}

// di chuyển
document.addEventListener("keydown", e=>{
    if(e.key=="w") y-=20;
    if(e.key=="s") y+=20;
    if(e.key=="a") x-=20;
    if(e.key=="d") x+=20;
    update();
});

// bắn
document.addEventListener("click", ()=>{
    let bullet = document.createElement("div");
    bullet.className="bullet";
    bullet.style.left = x + "px";
    bullet.style.top = y + "px";
    document.body.appendChild(bullet);

    let move = setInterval(()=>{
        let top = parseInt(bullet.style.top);
        top -= 10;
        bullet.style.top = top + "px";

        document.querySelectorAll(".enemy").forEach(enemy=>{
            let e = enemy.getBoundingClientRect();
            let b = bullet.getBoundingClientRect();

            if(
                b.top < e.bottom &&
                b.bottom > e.top &&
                b.left < e.right &&
                b.right > e.left
            ){
                enemy.remove();
                bullet.remove();
                score++;
                scoreText.innerText = score;
                clearInterval(move);
            }
        });

        if(top < 0){
            bullet.remove();
            clearInterval(move);
        }
    },20);
});

// spawn enemy
function spawnEnemy(){
    let enemy = document.createElement("div");
    enemy.className="enemy";
    enemy.style.left = Math.random()*window.innerWidth + "px";
    enemy.style.top = "0px";
    document.body.appendChild(enemy);

    let move = setInterval(()=>{
        let top = parseInt(enemy.style.top);
        top += 4;
        enemy.style.top = top + "px";

        let p = player.getBoundingClientRect();
        let e = enemy.getBoundingClientRect();

        if(
            e.bottom > p.top &&
            e.left < p.right &&
            e.right > p.left
        ){
            alert("💀 Game Over! Điểm: " + score);
            location.reload();
        }

        if(top > window.innerHeight){
            enemy.remove();
            clearInterval(move);
        }
    },30);
}

setInterval(spawnEnemy,1000);
update();
</script>

</body>
</html>
