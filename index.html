<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ADMIN HAIDANG</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
position:fixed;
top:0;
left:0;
}

#logo{
position:absolute;
top:15%;
left:50%;
transform:translateX(-50%);
font-size:70px;
font-weight:bold;
color:white;

text-shadow:
0 0 10px cyan,
0 0 20px cyan,
0 0 40px magenta,
0 0 80px magenta;

animation:spin 8s linear infinite,
glow 2s infinite alternate;
}

@keyframes spin{
0%{transform:translateX(-50%) rotateY(0deg);}
100%{transform:translateX(-50%) rotateY(360deg);}
}

@keyframes glow{

from{
text-shadow:
0 0 10px cyan,
0 0 20px cyan,
0 0 40px magenta;
}

to{
text-shadow:
0 0 20px yellow,
0 0 40px red,
0 0 80px magenta;
}

}

#videobox{

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);

border-radius:20px;
overflow:hidden;

box-shadow:
0 0 20px cyan,
0 0 40px magenta,
0 0 80px blue;

}

video{
width:600px;
display:block;
}

</style>
</head>

<body>

<div id="logo">ADMIN HAIDANG</div>

<div id="videobox">
<video controls>
<source src="video.mp4" type="video/mp4">
</video>
</div>

<canvas id="space"></canvas>

<script>

const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];

for(let i=0;i<300;i++){

stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*2,
speed:Math.random()*1
});

}

function draw(){

ctx.fillStyle="rgba(0,0,20,0.5)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

stars.forEach(s=>{

ctx.beginPath();
ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
ctx.fill();

s.y+=s.speed;

if(s.y>canvas.height){
s.y=0;
}

});

requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
