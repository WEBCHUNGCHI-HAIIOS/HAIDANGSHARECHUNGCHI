<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ADMIN HAIDANG</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
position:fixed;
top:0;
left:0;
}

#logo{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:80px;
font-weight:bold;
color:white;
text-align:center;

text-shadow:
0 0 10px cyan,
0 0 20px cyan,
0 0 40px magenta,
0 0 80px magenta,
0 0 120px blue;

animation:spin 10s linear infinite,
glow 2s infinite alternate;
}

@keyframes spin{

0%{
transform:translate(-50%,-50%) rotateY(0deg);
}

100%{
transform:translate(-50%,-50%) rotateY(360deg);
}

}

@keyframes glow{

from{
text-shadow:
0 0 20px cyan,
0 0 40px cyan,
0 0 80px magenta;
}

to{
text-shadow:
0 0 40px yellow,
0 0 80px red,
0 0 120px magenta;
}

}

</style>
</head>

<body>

<div id="logo">ADMIN HAIDANG</div>

<canvas id="space"></canvas>

<script>

const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];
let meteors=[];

for(let i=0;i<400;i++){

stars.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*2,
speed:Math.random()*1

});

}

for(let i=0;i<5;i++){

meteors.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
speed:5+Math.random()*5

});

}

function draw(){

ctx.fillStyle="rgba(0,0,20,0.5)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

stars.forEach(s=>{

ctx.beginPath();
ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
ctx.fill();

s.y+=s.speed;

if(s.y>canvas.height){
s.y=0;
}

});

ctx.strokeStyle="cyan";

meteors.forEach(m=>{

ctx.beginPath();
ctx.moveTo(m.x,m.y);
ctx.lineTo(m.x-80,m.y+20);
ctx.stroke();

m.x+=m.speed;
m.y+=m.speed;

if(m.x>canvas.width || m.y>canvas.height){

m.x=Math.random()*canvas.width;
m.y=0;

}

});

requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
