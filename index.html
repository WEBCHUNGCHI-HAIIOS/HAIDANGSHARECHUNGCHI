<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạp Hoá Hồng Hải media - Modern Store</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 80px; }
        
        /* Glassmorphism Header */
        header { 
            padding: 20px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .btn-auth { padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; margin-left: 10px; transition: 0.3s; }
        .btn-login { background: transparent; color: white; border: 1px solid white; }
        .btn-register { background: var(--primary); color: white; }

        /* Modern Hero Section */
        .hero { padding: 40px 20px; text-align: center; }
        .hero h1 { font-size: 24px; margin-bottom: 10px; }
        
        /* Modern Cards */
        .auth-container { padding: 20px; }
        .card { 
            background: var(--card-bg); backdrop-filter: blur(15px);
            padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; 
            background: #334155; border: none; color: white;
        }
        .btn-action { width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }

        /* Navigation */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%; background: rgba(30, 41, 59, 0.95);
            display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 800; font-size: 1.2rem;">Hồng Hải Media</div>
        <div>
            <button class="btn-auth btn-login">Đăng nhập</button>
            <button class="btn-auth btn-register">Đăng ký</button>
        </div>
    </header>

    <main class="auth-container">
        <div class="card">
            <h2>Chào mừng trở lại!</h2>
            <input type="text" placeholder="Tên đăng nhập hoặc Email">
            <input type="password" placeholder="Mật khẩu">
            <button class="btn-action">ĐĂNG NHẬP NGAY</button>
        </div>

        <div class="card">
            <h3>Nạp tiền siêu tốc</h3>
            <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px;">
                <p>VCB: 123456789 - NGUYEN HONG HAI</p>
                <p style="color: #60a5fa; font-size: 0.9rem;">Nội dung: NAP HONGHAI [Username]</p>
            </div>
            <button class="btn-action" style="background: #10b981; margin-top: 15px;">XÁC NHẬN CHUYỂN KHOẢN</button>
        </div>
    </main>

    <nav class="nav-bar">
        <span>🏠 Trang chủ</span>
        <span>📦 Sản phẩm</span>
        <span>💳 Nạp tiền</span>
        <span>⚙️ Tài khoản</span>
    </nav>

</body>
</html>
