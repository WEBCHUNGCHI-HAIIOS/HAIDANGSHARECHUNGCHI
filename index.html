<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ADMIN HONG HAI</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#000;
      font-family:Arial, sans-serif;
    }

    h1{
      color:#00ffcc;
      font-size:70px;
      text-shadow:
        0 0 10px #00ffcc,
        0 0 20px #00ffcc,
        0 0 40px #00ffcc;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow{
      from{
        transform:scale(1);
      }
      to{
        transform:scale(1.05);
      }
    }
  </style>
</head>

<body>
  <h1>ADMIN HONG HAI</h1>
</body>
</html>
