<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN HONG HAI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

/* Video nền full màn hình */
video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

/* Chữ */
.title{
    position:absolute;
    top:40px;
    width:100%;
    text-align:center;
}

.title h1{
    color:#00ffff;
    font-size:50px;
    font-weight:bold;
    line-height:1.2;

    text-shadow:
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 40px #00ffff,
        0 0 80px #00ffff;
}
</style>
</head>

<body>

<!-- Video nền -->
<video autoplay muted loop playsinline>
    <source src="snaptik.vn_.mp4" type="video/mp4">
</video>

<!-- Chữ -->
<div class="title">
    <h1>ADMIN</h1>
    <h1>HONG HAI</h1>
</div>

</body>
</html>
