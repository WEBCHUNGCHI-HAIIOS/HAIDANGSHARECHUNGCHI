<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạp Hoá Thập Cẩm Hồng Hải | MMO Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between">
            <h1 class="font-bold text-xl uppercase">Hồng Hải Media</h1>
            <div class="space-x-4">
                <a href="#san-pham">Sản phẩm MMO</a>
                <a href="#dich-vu">Dịch vụ</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mx-auto py-10 px-4">
        
        <!-- Bộ lọc (Giả lập chức năng hiện đại) -->
        <div class="mb-8 flex gap-4">
            <button onclick="render('all')" class="bg-blue-600 text-white px-4 py-2 rounded">Tất cả</button>
            <button onclick="render('sp')" class="bg-gray-200 px-4 py-2 rounded">Sản phẩm (50)</button>
            <button onclick="render('dv')" class="bg-gray-200 px-4 py-2 rounded">Dịch vụ (20)</button>
        </div>

        <!-- Lưới hiển thị -->
        <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- Dữ liệu sẽ đổ vào đây bằng JS -->
        </div>
    </div>

    <script>
        // Dữ liệu mẫu (Bạn chỉ cần thêm vào mảng này)
        const data = [
            { id: 1, type: 'sp', name: 'Tool Facebook A', price: '200k' },
            { id: 2, type: 'dv', name: 'Thiết kế Web chuẩn SEO', price: '5tr' },
            // ... thêm 68 mục nữa vào đây
        ];

        function render(filter) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? data : data.filter(item => item.type === filter);
            
            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow hover:scale-105 transition">
                        <div class="h-32 bg-gray-300 mb-2 rounded"></div>
                        <h3 class="font-bold text-sm">${item.name}</h3>
                        <p class="text-blue-600 font-bold">${item.price}</p>
                        <button class="w-full mt-2 bg-slate-800 text-white py-1 rounded text-sm">Mua ngay</button>
                    </div>
                `;
            });
        }
        // Gọi hàm hiển thị lần đầu
        render('all');
    </script>
</body>
</html>
