<!DOCTYPE html>
<html>
<head>
    <title>My Real 3D World</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>
<body>
    <a-scene shadow="type: pcfsoft" fog="type: exponential; color: #AAC; density: 0.015;">
        
        <a-assets>
            <img id="sky" src="bau_troi.jpg">
            <img id="grass" src="co.jpg">
            <img id="wall" src="gach.jpg">
        </a-assets>

        <a-sky src="#sky" rotation="0 -90 0"></a-sky>

        <a-plane position="0 0 0" 
                 rotation="-90 0 0" 
                 width="1000" height="1000" 
                 src="#grass" 
                 repeat="200 200"
                 shadow="receive: true">
        </a-plane>

        <a-box position="-5 2 -10" width="4" height="4" depth="4" src="#wall" shadow></a-box>
        <a-box position="5 2 -15" width="4" height="4" depth="4" src="#wall" shadow></a-box>
        <a-box position="0 2 -20" width="10" height="4" depth="1" src="#wall" shadow></a-box>

        <a-entity id="rig" movement-controls="speed: 0.3; constrainToNavMesh: true">
            <a-entity camera 
                      position="0 1.6 0" 
                      look-controls="pointerLockEnabled: true">
                <a-cursor color="#FF0000" radius="0.005"></a-cursor>
            </a-entity>
        </a-entity>

        <a-light type="ambient" color="#BBB"></a-light>
        <a-light type="directional" 
                 color="#FFF" 
                 intensity="0.8" 
                 position="-1 10 5" 
                 castShadow="true">
        </a-light>

    </a-scene>

    <div style="position: fixed; bottom: 20px; left: 20px; color: white; font-family: sans-serif; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; border: 1px solid #fff;">
        <b>CÁCH ĐIỀU KHIỂN:</b><br>
        - <b>Click chuột</b> vào màn hình để khóa chuột và nhìn xung quanh.<br>
        - Dùng <b>W, A, S, D</b> để di chuyển nhân vật.<br>
        - Nhấn <b>ESC</b> để hiện lại chuột.
    </div>
</body>
</html>
