<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game Né Vật Rơi</title>

<style>
body{
    margin:0;
    background:black;
    overflow:hidden;
}

#player{
    width:60px;
    height:60px;
    background:cyan;
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    border-radius:10px;
}

.fall{
    width:30px;
    height:30px;
    background:red;
    position:absolute;
    top:0;
    border-radius:5px;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:20px;
}

</style>
</head>

<body>

<div id="player"></div>
<div id="score">0</div>

<script>
let player = document.getElementById("player");
let scoreText = document.getElementById("score");

let x = window.innerWidth / 2;
let score = 0;

function updatePlayer(){
    player.style.left = x + "px";
}

// 🎮 Điều khiển bằng phím
document.addEventListener("keydown", e=>{
    if(e.key=="ArrowLeft") x -= 30;
    if(e.key=="ArrowRight") x += 30;
    updatePlayer();
});

// 📱 Điều khiển bằng chạm
document.addEventListener("touchstart", e=>{
    let touchX = e.touches[0].clientX;
    x = touchX;
    updatePlayer();
});

// 📱 Vuốt
document.addEventListener("touchmove", e=>{
    let touchX = e.touches[0].clientX;
    x = touchX;
    updatePlayer();
});

function spawn(){
    let block = document.createElement("div");
    block.className = "fall";
    block.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(block);

    let y = 0;

    let fall = setInterval(()=>{
        y += 6;
        block.style.top = y + "px";

        let playerRect = player.getBoundingClientRect();
        let blockRect = block.getBoundingClientRect();

        if(
            blockRect.bottom > playerRect.top &&
            blockRect.left < playerRect.right &&
            blockRect.right > playerRect.left
        ){
            alert("💀 Game Over! Điểm: " + score);
            location.reload();
        }

        if(y > window.innerHeight){
            score++;
            scoreText.innerText = score;
            block.remove();
            clearInterval(fall);
        }
    },30);
}

setInterval(spawn,800);
</script>

</body>
</html>
