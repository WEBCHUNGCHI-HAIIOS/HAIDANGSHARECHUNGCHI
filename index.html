<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN HAIDANG</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#000,#0f2027,#203a43);
    color:white;
    text-align:center;
}

h1{
    margin-top:20px;
    font-size:40px;
}

.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-top:30px;
}

.card{
    background:rgba(255,255,255,0.05);
    padding:20px;
    width:250px;
    border-radius:15px;
    backdrop-filter:blur(10px);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px cyan;
}

button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:cyan;
    color:black;
    cursor:pointer;
}

form{
    margin-top:40px;
}

input,select,textarea{
    padding:10px;
    margin:10px;
    width:250px;
    border-radius:10px;
    border:none;
}

</style>
</head>

<body>

<h1>ADMIN HAIDANG</h1>
<p>Dịch vụ nhanh - uy tín - giá rẻ</p>

<div class="container">

<div class="card">
<h3>🎨 Thiết kế Avatar</h3>
<p>Giá: 20k</p>
<button>Liên hệ</button>
</div>

<div class="card">
<h3>💻 Làm Web HTML</h3>
<p>Giá: 50k</p>
<button>Liên hệ</button>
</div>

<div class="card">
<h3>🔥 Hiệu ứng Web</h3>
<p>Giá: 30k</p>
<button>Liên hệ</button>
</div>

</div>

<h2>📩 Đặt dịch vụ</h2>

<form>
<input type="text" placeholder="Tên của bạn"><br>
<select>
<option>Chọn dịch vụ</option>
<option>Thiết kế Avatar</option>
<option>Làm Web HTML</option>
<option>Hiệu ứng Web</option>
</select><br>
<textarea placeholder="Yêu cầu của bạn"></textarea><br>
<button>Gửi</button>
</form>

</body>
</html>
