<!DOCTYPE html>
<html>
  <head>
    <title>3D Real World - VR Experience</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene symbols="physics: ammo; gravity: -9.8;">
      
      <a-sky src="https://cdn.polyhaven.com/asset_img/primary/clouds_layers.jpg?height=720" rotation="0 -90 0"></a-sky>

      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" 
               src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/textures/ground/grasslight-big.jpg" 
               repeat="50 50"></a-plane>

      <a-light type="ambient" color="#BBB"></a-light>
      <a-light type="directional" color="#FFF" intensity="0.6" position="-1 1 2"></a-light>

      <a-box position="0 1 -5" width="4" height="2" depth="4" color="#8B4513" src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/textures/walls/brick_diffuse.jpg"></a-box>
      <a-cone position="0 3 -5" radius-bottom="3" height="2" color="#444"></a-cone>

      <a-entity id="rig" movement-controls="speed: 0.2;">
        <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: true">
            <a-cursor id="cursor" color="white" radius="0.005"></a-cursor>
        </a-entity>
      </a-entity>

      <div style="position: fixed; top: 10px; left: 10px; color: white; font-family: sans-serif; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;">
        Sử dụng <b>WASD</b> để đi lại<br>
        Click chuột vào màn hình để <b>Xoay nhìn</b> (Nhấn ESC để thoát chuột)
      </div>

    </a-scene>
  </body>
</html>
