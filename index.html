<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ADMIN HAIDANG</title>

<style>

body{
margin:0;
background:black;
color:white;
text-align:center;
font-family:Arial;
overflow:hidden;
}

#logo{
font-size:60px;
margin-top:40px;
text-shadow:0 0 10px cyan,0 0 20px cyan,0 0 40px magenta;
}

audio{
margin-top:40px;
width:500px;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

</style>
</head>

<body>

<h1 id="logo">ADMIN HAIDANG</h1>

<audio controls autoplay loop>
<source src="video.mp3" type="audio/mpeg">
</audio>

<canvas id="stars"></canvas>

<script>

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];

for(let i=0;i<200;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*2
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

stars.forEach(s=>{
ctx.beginPath();
ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
ctx.fill();

s.y+=0.3;

if(s.y>canvas.height){
s.y=0;
}

});

requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
