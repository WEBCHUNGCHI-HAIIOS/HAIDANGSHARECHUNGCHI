<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN HAIDANG</title>

<style>

body{
margin:0;
padding:0;
background:black;
font-family:Arial;
overflow:hidden;
}

/* màn hình thông báo */
#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
color:white;
z-index:10;
}

/* chữ */
#intro h2{
font-size:30px;
margin-bottom:40px;
text-shadow:0 0 10px #00ffff,0 0 20px #00ffff;
}

/* nút truy cập */
#enter{
padding:15px 45px;
font-size:22px;
background:#00ff88;
border:none;
border-radius:12px;
cursor:pointer;
box-shadow:0 0 20px #00ff88;
}

/* hiệu ứng nút */
#enter:hover{
transform:scale(1.1);
}

/* video nền */
video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-1;
}

/* chữ ADMIN */
h1{
position:absolute;
top:40px;
width:100%;
text-align:center;
font-size:50px;
color:#00ffff;
text-shadow:0 0 20px #00ffff,0 0 40px #00ffff;
}

/* nút facebook */
.fb-btn{
position:fixed;
bottom:20px;
right:20px;
background:#1877f2;
color:white;
padding:12px 20px;
border-radius:30px;
font-size:16px;
font-weight:bold;
text-decoration:none;
box-shadow:0 0 15px rgba(0,0,0,0.6);
transition:0.3s;
z-index:5;
}

.fb-btn:hover{
transform:scale(1.1);
background:#0d5ed7;
}

</style>

</head>

<body>

<div id="intro">

<h2>
ADMIN HAIDANG<br>
NHẬN GDTG - ĐỔI TIỀN 24/7<br>
THU SLL ALL GAME<br>
CÂN ALL DỊCH VỤ
</h2>

<button id="enter">TRUY CẬP</button>

</div>

<h1>ADMIN HAIDANG</h1>

<video id="video" loop>
<source src="nhac.mp4" type="video/mp4">
</video>

<!-- nút facebook -->
<a class="fb-btn" href="https://www.facebook.com/ADMINGDTGDINHHOANG" target="_blank">
CHECK FB ADMIN
</a>

<script>

let btn=document.getElementById("enter");
let intro=document.getElementById("intro");
let video=document.getElementById("video");

btn.onclick=function(){

intro.style.display="none";

video.play();

}

</script>

</body>
</html>
