<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạp Hoá Hồng Hải media - Đăng nhập/Nạp tiền</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f6f9; padding-bottom: 70px; }
        
        .header { display: flex; justify-content: space-between; padding: 15px; background: #fff; border-bottom: 1px solid #ddd; align-items: center; position: sticky; top: 0; }
        .logo { font-weight: bold; font-size: 18px; color: #d32f2f; }
        
        .container { padding: 15px; }
        
        /* Form Đăng nhập/Đăng ký */
        .auth-box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 10px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-main { width: 100%; padding: 10px; background: #d32f2f; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Bảng nạp tiền */
        .deposit-box { background: #fff; padding: 20px; border-radius: 10px; }
        .bank-info { background: #fff3e0; padding: 15px; border-left: 5px solid #ff9800; border-radius: 5px; }

        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: #fff; 
            display: flex; justify-content: space-around; padding: 12px;
            border-top: 2px solid #ddd; font-size: 11px;
        }
        .bottom-nav a { text-decoration: none; color: #555; text-align: center; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">Tạp Hoá Hồng Hải media</div>
        <div>👤 Đăng nhập</div>
    </header>

    <main class="container">
        <div class="auth-box">
            <h3>Đăng nhập hệ thống</h3>
            <div class="input-group"><input type="text" placeholder="Tên đăng nhập"></div>
            <div class="input-group"><input type="password" placeholder="Mật khẩu"></div>
            <button class="btn-main">ĐĂNG NHẬP</button>
            <p style="text-align:center; font-size: 13px;">Chưa có tài khoản? <a href="#">Đăng ký ngay</a></p>
        </div>

        <div class="deposit-box">
            <h3>Nạp tiền tự động</h3>
            <div class="bank-info">
                <p><strong>Ngân hàng:</strong> Vietcombank</p>
                <p><strong>STK:</strong> 123456789</p>
                <p><strong>Chủ TK:</strong> NGUYEN HONG HAI</p>
                <p><strong>Nội dung:</strong> NAP HONGHAI [Username]</p>
            </div>
            <button class="btn-main" style="margin-top: 15px; background: #2e7d32;">XÁC NHẬN NẠP TIỀN</button>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="#">Trang chủ</a>
        <a href="#">Sản phẩm</a>
        <a href="#">Nạp tiền</a>
        <a href="#">Đơn hàng</a>
    </nav>

</body>
</html>
