<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ADMIN HAIDANG</title>

<style>

body{
margin:0;
padding:0;
background:black;
overflow:hidden;
font-family:Arial;
color:white;
text-align:center;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

h1{
margin-top:60px;
font-size:60px;
color:#00ffff;
text-shadow:0 0 20px #00ffff,0 0 40px #00ffff,0 0 60px #00ffff;
}

.video-box{
margin-top:40px;
display:flex;
justify-content:center;
}

video{
width:700px;
border-radius:20px;
box-shadow:0 0 40px #ff00ff;
}

</style>
</head>

<body>

<h1>ADMIN HAIDANG</h1>

<div class="video-box">
<video controls autoplay loop>
<source src="video.mp4" type="video/mp4">
</video>
</div>

<canvas id="stars"></canvas>

<script>

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars=[];

for(let i=0;i<200;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*2
});
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

stars.forEach(s=>{
ctx.beginPath();
ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
ctx.fill();
});

requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
