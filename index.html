<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ADMIN HAIDANG</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:Arial;
text-align:center;
}

#logo{
font-size:60px;
margin-top:40px;

text-shadow:
0 0 10px cyan,
0 0 20px cyan,
0 0 40px magenta;

animation:spin 8s linear infinite;
}

@keyframes spin{
0%{transform:rotateY(0deg);}
100%{transform:rotateY(360deg);}
}

video{
margin-top:50px;
width:600px;
border-radius:20px;

box-shadow:
0 0 20px cyan,
0 0 40px magenta;

}

</style>
</head>

<body>

<div id="logo">ADMIN HAIDANG</div>

<video controls autoplay>
<source src="video.mp4" type="video/mp4">
Trình duyệt không hỗ trợ video
</video>

</body>
</html>
