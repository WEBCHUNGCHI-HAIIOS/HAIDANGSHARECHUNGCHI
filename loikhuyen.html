<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Bạn Đồng Hành</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.chatbox{
width:420px;
height:550px;
background:white;
border-radius:20px;
display:flex;
flex-direction:column;
overflow:hidden;
box-shadow:0 0 30px rgba(0,0,0,0.4);
}

.header{
background:#2a5298;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

.messages{
flex:1;
padding:15px;
overflow:auto;
background:#f4f6fb;
}

.msg{
margin:10px 0;
max-width:70%;
padding:10px;
border-radius:10px;
}

.user{
margin-left:auto;
background:#2a5298;
color:white;
}

.bot{
background:#e5e5ea;
}

.inputbox{
display:flex;
border-top:1px solid #ddd;
}

input{
flex:1;
padding:12px;
border:none;
font-size:16px;
outline:none;
}

button{
width:80px;
border:none;
background:#2a5298;
color:white;
font-size:16px;
cursor:pointer;
}

.snow{
position:fixed;
top:-10px;
color:white;
font-size:10px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(100vh);
}
}
</style>
</head>

<body>

<div class="chatbox">

<div class="header">
🤖 AI Bạn Đồng Hành
</div>

<div class="messages">
<div class="msg bot">
Xin chào 👋 Tôi là AI. Hãy nhắn tin cho tôi!
</div>
</div>

</div>

<!-- Chatbot BotKit -->
<div id="ai-bot-kit-chatbot" data-chatbot-id="ba1c1769-2922-44"></div>
<script src="https://app.aibotkit.io/embed.js" async defer></script>

<script>
function snow(){
let snow=document.createElement("div")
snow.className="snow"
snow.innerHTML="❄"
snow.style.left=Math.random()*window.innerWidth+"px"
snow.style.animationDuration=(Math.random()*3+2)+"s"

document.body.appendChild(snow)

setTimeout(()=>{snow.remove()},5000)
}

setInterval(snow,120)
</script>

</body>
</html>
