<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Bạn Đồng Hành</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.chatbox{
width:420px;
height:550px;
background:white;
border-radius:20px;
display:flex;
flex-direction:column;
overflow:hidden;
box-shadow:0 0 30px rgba(0,0,0,0.4);
}

.header{
background:#2a5298;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

.messages{
flex:1;
padding:15px;
overflow:auto;
background:#f4f6fb;
}

.msg{
margin:10px 0;
max-width:70%;
padding:10px;
border-radius:10px;
}

.user{
margin-left:auto;
background:#2a5298;
color:white;
}

.bot{
background:#e5e5ea;
}

.inputbox{
display:flex;
border-top:1px solid #ddd;
}

input{
flex:1;
padding:12px;
border:none;
font-size:16px;
outline:none;
}

button{
width:80px;
border:none;
background:#2a5298;
color:white;
font-size:16px;
cursor:pointer;
}

.snow{
position:fixed;
top:-10px;
color:white;
font-size:10px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(100vh);
}
}
</style>
</head>

<body>

<div class="chatbox">

<div class="header">
🤖 AI Bạn Đồng Hành
</div>

<div class="messages" id="messages">
<div class="msg bot">
Xin chào 👋 Tôi là AI. Bạn muốn hỏi gì?
</div>
</div>

<div class="inputbox">
<input id="input" placeholder="Nhắn tin..." />
<button onclick="send()">Gửi</button>
</div>

</div>

<script>

const API_KEY = "DAN_API_KEY_CUA_BAN";

let input=document.getElementById("input")

input.addEventListener("keypress",function(e){
if(e.key==="Enter") send()
})

async function send(){

let text=input.value.trim()
if(text=="") return

add("user",text)

input.value=""

let loading=add("bot","AI đang trả lời...")

try{

let res = await fetch("https://api.openai.com/v1/chat/completions",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+API_KEY
},
body:JSON.stringify({
model:"gpt-4o-mini",
messages:[
{role:"user",content:text}
]
})
})

let data = await res.json()

let reply=data.choices[0].message.content

loading.remove()

add("bot",reply)

speak(reply)

}catch(err){

loading.remove()

add("bot","⚠️ AI đang lỗi hoặc thiếu API key.")

}

}

function add(type,text){

let box=document.getElementById("messages")

let div=document.createElement("div")

div.className="msg "+type

div.innerText=text

box.appendChild(div)

box.scrollTop=box.scrollHeight

return div

}

function speak(text){

let speech=new SpeechSynthesisUtterance(text)
speech.lang="vi-VN"
speechSynthesis.speak(speech)

}

function snow(){

let snow=document.createElement("div")

snow.className="snow"
snow.innerHTML="❄"
snow.style.left=Math.random()*window.innerWidth+"px"
snow.style.animationDuration=(Math.random()*3+2)+"s"

document.body.appendChild(snow)

setTimeout(()=>{
snow.remove()
},5000)

}

setInterval(snow,120)

</script>

</body>
</html>
